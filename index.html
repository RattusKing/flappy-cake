<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Cake - A Sweet Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Fredoka', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 107, 157, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(72, 219, 251, 0.3) 0%, transparent 50%);
            pointer-events: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            z-index: 1;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            pointer-events: auto;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 72px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px #ff6b9d,
                         0 0 40px #ff6b9d,
                         0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px #ff6b9d,
                             0 0 40px #ff6b9d,
                             0 4px 8px rgba(0, 0, 0, 0.3);
            }
            50% {
                text-shadow: 0 0 30px #ff6b9d,
                             0 0 60px #ff6b9d,
                             0 0 80px #ff6b9d,
                             0 4px 8px rgba(0, 0, 0, 0.3);
            }
        }

        .subtitle {
            font-size: 24px;
            font-weight: 400;
            color: #feca57;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        button {
            font-family: 'Fredoka', 'Arial', sans-serif;
            font-size: 24px;
            font-weight: 600;
            padding: 18px 48px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 107, 157, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 32px rgba(255, 107, 157, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        button:active {
            transform: translateY(-2px) scale(1.02);
            transition: all 0.1s;
        }

        #score {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 56px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px #feca57,
                         0 0 40px #feca57,
                         0 4px 8px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        #highScore {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 15px #48dbfb,
                         0 2px 4px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .final-score {
            font-size: 36px;
            font-weight: 600;
            color: #fff;
            margin: 20px 0;
            text-shadow: 0 0 15px #feca57,
                         0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .instructions {
            font-size: 18px;
            font-weight: 400;
            color: #48dbfb;
            margin-top: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="640"></canvas>

        <div class="ui-overlay">
            <div id="startScreen" class="screen active">
                <h1>🍰 FLAPPY CAKE 🍰</h1>
                <p class="subtitle">Navigate through the candles!</p>
                <button id="startButton">START GAME</button>
                <p class="instructions">Click or press SPACE to flap</p>
            </div>

            <div id="gameOverScreen" class="screen">
                <h1>GAME OVER</h1>
                <p class="final-score">Score: <span id="finalScore">0</span></p>
                <p class="final-score">Best: <span id="finalHighScore">0</span></p>
                <button id="restartButton">PLAY AGAIN</button>
            </div>
        </div>

        <div id="score">0</div>
        <div id="highScore">Best: 0</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
