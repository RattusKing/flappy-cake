<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Flappy Cake - A Sweet Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            padding: 16px;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 107, 157, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(72, 219, 251, 0.3) 0%, transparent 50%);
            pointer-events: none;
        }

        /*
         * The game keeps a fixed 480x640 logical resolution, but the container
         * scales to fill the viewport (keeping the 3:4 aspect ratio). All UI
         * sizes use container-query units (cqw) so the overlay scales with it.
         */
        #gameContainer {
            position: relative;
            width: min(100%, calc((100dvh - 32px) * 0.75));
            aspect-ratio: 3 / 4;
            container-type: inline-size;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            z-index: 1;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            touch-action: none;
            cursor: pointer;
        }

        .ui-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4cqw;
            pointer-events: auto;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 14cqw;
            line-height: 1.05;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px #ff6b9d,
                         0 0 40px #ff6b9d,
                         0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 4cqw;
            animation: glow 2s ease-in-out infinite;
            letter-spacing: 0.03em;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px #ff6b9d,
                             0 0 40px #ff6b9d,
                             0 4px 8px rgba(0, 0, 0, 0.3);
            }
            50% {
                text-shadow: 0 0 30px #ff6b9d,
                             0 0 60px #ff6b9d,
                             0 0 80px #ff6b9d,
                             0 4px 8px rgba(0, 0, 0, 0.3);
            }
        }

        .subtitle {
            font-size: 5cqw;
            font-weight: 400;
            color: #feca57;
            margin-bottom: 6cqw;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        button {
            font-family: inherit;
            font-size: 5cqw;
            font-weight: 600;
            padding: 3.5cqw 10cqw;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 100cqw;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 107, 157, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.02em;
            -webkit-tap-highlight-color: transparent;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 32px rgba(255, 107, 157, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        button:active {
            transform: translateY(-2px) scale(1.02);
            transition: all 0.1s;
        }

        #score {
            position: absolute;
            top: 4cqw;
            right: 6cqw;
            font-size: 12cqw;
            line-height: 1;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px #feca57,
                         0 0 40px #feca57,
                         0 4px 8px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            font-variant-numeric: tabular-nums;
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        #highScore {
            position: absolute;
            top: 5cqw;
            left: 5cqw;
            font-size: 4.5cqw;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 15px #48dbfb,
                         0 2px 4px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 2cqw 4cqw;
            border-radius: 100cqw;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .final-score {
            font-size: 7cqw;
            font-weight: 600;
            color: #fff;
            margin: 2.5cqw 0;
            text-shadow: 0 0 15px #feca57,
                         0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .final-score + button {
            margin-top: 3cqw;
        }

        .instructions {
            font-size: 3.75cqw;
            font-weight: 400;
            color: #48dbfb;
            margin-top: 5cqw;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            opacity: 0.9;
        }

        /* Edge-to-edge on phones */
        @media (max-width: 520px) {
            body {
                padding: 0;
            }

            #gameContainer {
                width: min(100%, calc(100dvh * 0.75));
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="640"></canvas>

        <div class="ui-overlay">
            <div id="startScreen" class="screen active">
                <h1>🍰 FLAPPY CAKE 🍰</h1>
                <p class="subtitle">Navigate through the candles!</p>
                <button id="startButton">START GAME</button>
                <p class="instructions">Click, tap or press SPACE to flap</p>
            </div>

            <div id="gameOverScreen" class="screen">
                <h1>GAME OVER</h1>
                <p class="final-score">Score: <span id="finalScore">0</span></p>
                <p class="final-score">Best: <span id="finalHighScore">0</span></p>
                <button id="restartButton">PLAY AGAIN</button>
            </div>
        </div>

        <div id="score">0</div>
        <div id="highScore">Best: 0</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
